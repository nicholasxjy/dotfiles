[theme]
name = "terminal"

[theme.custom]
# === 整体重点色与背景层级 ===
accent = "#35a77c"          # 经典森野翠绿 (聚焦边框 / 核心高亮)
panel_bg = "reset"          # 完美契合 Ghostty 底层背景 (#e5dfc5)，消除分屏拼接割裂感
# sidebar_bg = "#eae4ca"        # 柔和暖调羊皮纸侧边栏，与主面板形成层次区隔
# active_row_bg = "#dcd6bd"     # 当前活动标签 / 选中工作区背景，视觉聚焦清晰
# selection_bg = "#d2dba9"      # 列表选中项 / 选区高亮 (微青苔草绿，清晰不刺眼)
surface0 = "#eae4ca"          # 弹窗、卡片基础背景
surface1 = "#dfd9bd"          # 命令栏输入框、高亮悬浮层
surface_dim = "#e0dac0"       # 凹陷区域、底栏背景

# === 边界与分隔线 ===
overlay0 = "#b5bba8"          # 非活动分屏边框与分隔线 (柔和但轮廓分明)
overlay1 = "#708089"          # 快捷键提示 / 次级边框 / 面包屑

# === 文字排版层级 (告别发灰模糊，对比度严格达标 WCAG AAA/AA) ===
text = "#2d353b"              # 主文字 (深林青墨，对比度 > 9.3:1，字迹清晰锐利)
subtext0 = "#5c6a72"          # 次级文字 (经典森野灰绿，对比度 > 4.2:1，状态与辅助说明)

# === 语义状态色 (Agent 状态指示灯、标签与告警) ===
green = "#688a24"             # 正常运行 / 成功 (自然草绿)
yellow = "#b07a00"            # 思考中 / 警告 (暖金黄，浅色背景下绝不发飘)
red = "#cc4242"               # 错误 / 阻断 (柔和红)
blue = "#2d799e"              # 信息 / 链接 (湖蓝)
teal = "#26896c"              # 次级重点 / 徽标 (冷翠绿)
peach = "#d46417"             # 待办 / 动作提示 (暖杏橙)
mauve = "#a8528c"             # 特殊 Agent / 紫罗兰高亮
