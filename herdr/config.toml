
onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

[update]
channel = "stable"

# Everforest Soft Light
# Herdr: https://herdr.dev/docs/configuration/#theme
# Palette: https://github.com/sainnhe/everforest/blob/master/autoload/everforest.vim
[theme]
name = "terminal"

# [theme.custom]
# selection_bg = "#e5e6c5" # bg_green
# active_row_bg = "#e1e4bd"  # bg_visual
# surface0 = "#e5dfc5"      # bg2
# surface1 = "#ddd8be"      # bg3
# surface_dim = "#d8d3ba"   # bg_dim
#
# overlay0 = "#b9c0ab"      # bg5
# overlay1 = "#939f91"      # grey1
# text = "#5c6a72"          # fg
# subtext0 = "#829181"      # grey2
#
# accent = "#8da101"        # green
# mauve = "#df69ba"         # purple
# green = "#8da101"
# yellow = "#dfa000"
# red = "#f85552"
# blue = "#3a94c5"
# teal = "#35a77c"          # aqua
# peach = "#f57d26"         # orange

[keys]
prefix = "ctrl+a"

new_tab = ["prefix+c", "alt+t"]
previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+l"]
close_tab = "prefix+ampersand"

close_pane = ["prefix+x", "alt+x"]
split_vertical = ["prefix+\\", "alt+n"]
split_horizontal = ["prefix+minus", "alt+d"]

workspace_picker = "prefix+o"
new_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"

# goto = "alt+s"
reload_config = "prefix+r"
settings = "prefix+;"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction left --current'
description = "resize pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction down --current'
description = "resize pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction up --current'
description = "resize pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction right --current'
description = "resize pane right"


[experimental]
# Allow launching herdr from inside a herdr-managed pane.
# allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true
# Save recent pane screen history across full server restarts.
pane_history = false
# Expose the focused pane's cursor to the outer terminal so macOS input
# methods keep tracking the candidate window when TUIs paint their own
# cursor (Claude Code, pi, codex). Trade-off: extra cursor visible for
# apps that hide it without painting a replacement (vim normal mode, etc.).
reveal_hidden_cursor_for_cjk_ime = false
# Optional allow-list: only reveal for focused panes whose detected agent
# matches one of these names. Empty means apply to any focused pane.
# If the list contains no valid names, the reveal does not apply.
# Accepted: pi, claude, codex, gemini, cursor, cline, opencode, copilot,
# kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qoder.
# cjk_ime_agents = []
# Cursor shape rendered when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block (default), underline, steady_underline, bar, steady_bar.
# cjk_ime_cursor_shape = "steady_block"
