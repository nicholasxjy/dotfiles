# Fish prompt: directory, Git, runtime, failure, duration and active proxy.
add_newline = true
format = "$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$java$cmd_duration$status${custom.proxy}$line_break$jobs$character"
right_format = "$time"

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 只读"

[git_branch]
symbol = "git:"

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
format = '[耗时 $duration]($style) '

[status]
disabled = false
format = '[退出 $status]($style) '

[jobs]
format = '[后台 $number]($style) '
number_threshold = 1

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

[time]
disabled = false
time_format = '%H:%M:%S'
format = '[$time](dimmed white)'

[custom.proxy]
when = 'test -n "$HTTPS_PROXY$https_proxy$ALL_PROXY$all_proxy$HTTP_PROXY$http_proxy"'
format = '[代理](cyan) '
shell = ['sh']
