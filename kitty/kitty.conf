# vim:ft=conf
#
shell /bin/zsh
shell_integration no-cursor
# Font settings
font_size 17

disable_ligatures never
# modify_font cell_width 80%
modify_font cell_height 90%
modify_font baseline 3

# Cursor settings
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.15
cursor_shape underline
cursor_blink_interval -1
# Window decorations
hide_window_decorations no
macos_titlebar_color background
window_margin_width 0
window_padding_width 0
# Miscellaneous settings
# Enable option key as Alt on macOS
macos_option_as_alt yes
# Set scrollback lines maximum
scrollback_lines 1000000

# Copy on select
# Automatically copy text to the clipboard when selected
copy_on_select yes


font_family      family="Operator Mono SSm Lig" style="book" features="+liga +ss11 +ss12"
bold_font        auto
italic_font      auto
bold_italic_font auto





#
#
# BEGIN_KITTY_SYMBOL_MAPS
#
