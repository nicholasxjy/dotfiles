add_newline = true
format = "$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$java$cmd_duration$status${custom.proxy}$line_break$jobs$character"
right_format = "$time"

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = " "

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
format = '[ $duration]($style) '

[status]
disabled = false
format = '[ $status]($style) '

[jobs]
format = '[ $number]($style) '
number_threshold = 1

[character]
success_symbol = '[✓](bold green)'
error_symbol = '[✗](bold red)'
vimcmd_symbol = '[❮](bold yellow)'
vimcmd_replace_one_symbol = '[↔](bold purple)'
vimcmd_replace_symbol = '[↔](bold purple)'
vimcmd_visual_symbol = '[▧](bold cyan)'

[time]
disabled = false
time_format = '%H:%M:%S'
format = '[$time](dimmed white)'

[custom.proxy]
when = 'test -n "$HTTPS_PROXY$https_proxy$ALL_PROXY$all_proxy$HTTP_PROXY$http_proxy"'
command = 'printf "%s" "${HTTPS_PROXY:-${https_proxy:-${ALL_PROXY:-${all_proxy:-${HTTP_PROXY:-$http_proxy}}}}}"'
format = '[󰌘 \[$output\]](cyan) '
shell = ['sh']
